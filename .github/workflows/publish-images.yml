name: Publish Base Container Images

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        include:
          - image: bozemanpass/webapp-base
            dir: webapp-base
          - image: bozemanpass/nextjs-base
            dir: nextjs-base
          - image: bozemanpass/node-service-base
            dir: node-service-base
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate container image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ matrix.image }}
          tags: |
            type=sha,enable=true,priority=100,prefix=,suffix=,format=long
            # if is in MAIN branch, also tag as latest
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to Container Image Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.dir }}
          file: ${{ matrix.dir }}/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
